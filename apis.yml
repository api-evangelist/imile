aid: imile
name: iMile
description: >-
  iMile is a technology-driven last-mile delivery and e-commerce logistics
  company founded in 2017 and headquartered in Dubai, United Arab Emirates. Led
  by founder and CEO Rita Huang, iMile provides express parcel delivery,
  cash-on-delivery (COD), domestic and international express, dropshipping,
  order fulfillment, warehousing, storage, and reverse logistics / return
  management across more than 30 countries spanning the Middle East, China,
  Latin America, Africa, Europe, and Australia. The company operates its own
  routing, tracking, and delivery technology and employs over 20,000 people.
  iMile assigns each shipment a 13-digit tracking number; parcel tracking is
  available on imile.com and through major third-party tracking aggregators.
  iMile does not currently publish a first-party public developer API or open
  platform, so this profile captures its identity and domain-security posture.
